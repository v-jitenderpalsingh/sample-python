name: Test run
on: [push, workflow_dispatch]
jobs:
  test-python:
    name: Demonstrate PyPy pip issue on test branch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['pypy3.11-v7.3.20', '3.14.5', 'pypy3.7', 'pypy2.7']
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: v-jitenderpalsingh/setup-python@test-1348
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pip
      run: |
        python -m pip cache dir 
        python -m pip install --upgrade pip

    - name: Use pip
      run: |
        python -m pip --version
        python -m pip cache dir
        python -m pip install -U requests
