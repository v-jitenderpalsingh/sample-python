name: Test run
on: [push, workflow_dispatch]
jobs:
  test-python:
    name: Check issue 1352
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: graalpy-25.3
        check-latest: true

    - name: Check Python version
      run: |
        python --version