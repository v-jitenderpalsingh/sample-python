name: Test run
on: [push, workflow_dispatch]
jobs:
  test-python:
    name: Check Python logs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@main

    - uses: actions/setup-python@main
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Check Python version
      run: |
        python --version
        python main.py
    
    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Setup Again
      uses: actions/setup-python@main
      with:
        python-version: "3.14"
        cache: "pip"
        
    - name: Check Python version Again
      run: |
        python --version
        python main.py