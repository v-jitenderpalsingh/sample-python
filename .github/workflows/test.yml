name: Test run
on: [push, workflow_dispatch]
jobs:
  test-python:
    name: Check nightly
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: deadsnakes/action@v3.2.0
      with:
        python-version: "3.16-dev"

    - name: Check Python version
      run: |
        python -VVV
        pip --version