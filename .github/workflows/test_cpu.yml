name: Test Python CPU compatibility

on: [workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        version: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.version }}

      - name: test python version
        run: python --version

      - name: Check flags
        run: python -m sysconfig | grep -E 'CFLAGS|LDFLAGS|CONFIG_ARGS'

