name: Test Python CPU compatibility

on: [push, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12.16'

      - name: test python version
        run: python --version

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils

      - name: Inspect Python CPU requirements
        run: readelf -n "$pythonLocation/bin/python3.12"

      - name: Test Haswell CPU
        run: qemu-x86_64 -cpu Haswell "$pythonLocation/bin/python3.12" -S -c pass

      - name: Test older Westmere CPU
        run: qemu-x86_64 -cpu Westmere "$pythonLocation/bin/python3.12" -S -c pass